name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

  kotlin-compatibility:
    name: Kotlin compatibility / Consumer Kotlin ${{ matrix.kotlin-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version:
          - 2.4.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish artifacts built with Kotlin 2.4.0
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Test consumer project
        working-directory: compatibility/jvm-consumer
        run: ../../gradlew test --stacktrace -Pconsumer.kotlin.version=${{ matrix.kotlin-version }}

  apple-native:
    name: Apple native
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test Apple native targets
        run: ./gradlew :fiktion-core:macosArm64Test :fiktion-core:iosSimulatorArm64Test --stacktrace
