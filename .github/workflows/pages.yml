name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and Deploy Dokka
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout Pages branch
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare previous versions
        working-directory: source
        run: |
          current_version="$(./gradlew -q printVersion)"
          mkdir -p build/dokka/olderVersions
          if [ -d ../pages ]; then
            if [ -d ../pages/older ]; then
              find ../pages/older -mindepth 1 -maxdepth 1 -type d | while read -r older_version_dir; do
                older_version="$(basename "${older_version_dir}")"
                if [ "${older_version}" != "${current_version}" ]; then
                  cp -R "${older_version_dir}" build/dokka/olderVersions/
                fi
              done
            else
              find ../pages -maxdepth 1 -type d -name 'v*' | while read -r version_dir; do
                version="$(basename "${version_dir}")"
                if [ "${version#v}" != "${current_version}" ]; then
                  cp -R "${version_dir}" "build/dokka/olderVersions/${version#v}"
                fi
              done
            fi
            if [ -f ../pages/version.json ]; then
              root_version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ../pages/version.json)"
              if [ -n "${root_version}" ] && [ "${root_version}" != "${current_version}" ]; then
                mkdir -p "build/dokka/olderVersions/${root_version}"
                rsync -a --checksum --delete --exclude '.git' --exclude 'v*/' --exclude 'older/' ../pages/ "build/dokka/olderVersions/${root_version}/"
              fi
            fi
          fi

      - name: Build Dokka HTML
        working-directory: source
        run: ./gradlew :dokkaGeneratePublicationHtml --stacktrace

      - name: Prepare Pages content
        working-directory: source
        run: |
          version="$(./gradlew -q printVersion)"
          mkdir -p ../pages
          rsync -a --checksum --delete --exclude '.git' --exclude 'v*/' --exclude 'older/' build/dokka/html/ ../pages/
          if [ -d build/dokka/html/older ]; then
            rsync -a --checksum --delete build/dokka/html/older/ ../pages/older/
          fi
          if [[ "${version}" != *-SNAPSHOT ]]; then
            find ../pages -maxdepth 1 -type d -name 'v*' -exec rm -rf {} +
            printf '{"version":"%s"}\n' "${version}" > ../pages/version.json
          fi
          touch ../pages/.nojekyll
          echo "fiktion.s7a.dev" > ../pages/CNAME

      - name: Deploy Pages branch
        working-directory: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -d .git ]; then
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No Pages changes to deploy."
          else
            git commit -m "Deploy Dokka documentation"
            git push origin gh-pages
          fi
